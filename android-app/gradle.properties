# Ajustes de Gradle para la compilación de Android.
# JVM con memoria suficiente y caché para compilaciones más rápidas.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Usar las bibliotecas AndroidX (requisito de las dependencias actuales).
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
